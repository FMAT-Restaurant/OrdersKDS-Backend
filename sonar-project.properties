# SonarCloud / SonarQube Project Properties
# Nota: Debes reemplazar 'mi-organizacion' y 'mi-project-key' con los valores reales
# que te genere SonarCloud al crear el proyecto.

sonar.organization=fmat-restaurant
sonar.projectKey=FMAT-Restaurant_OrdersKDS-Backend
sonar.projectName=OrdersKDS-Backend

# Rutas del código fuente y pruebas
sonar.sources=app
sonar.tests=tests

# Reportes de cobertura (generado por pytest en el CI)
sonar.python.coverage.reportPaths=coverage.xml

# Exclusiones (archivos que no quieres que cuenten para la cobertura ni análisis)
sonar.exclusions=app/alembic/**, **/*.pyc, **/__pycache__/**

# Versión de Python
sonar.python.version=3.12
