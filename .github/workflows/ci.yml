name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr:
    name: Validate PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate branch name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          if [[ "$BRANCH_NAME" == "develop" ]]; then
            echo "Skipping branch name validation for develop branch"
            exit 0
          fi
          if [[ ! "$BRANCH_NAME" =~ ^[a-z0-9]+-[a-z]+$ ]]; then
            echo "Error: Branch name '$BRANCH_NAME' does not match pattern ^[a-z0-9]+-[a-z]+$"
            exit 1
          fi
      - name: Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-types:
    name: Lint, Types & Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/dev.txt"
          
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
        
      - name: Run Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --source . -v
        
      - name: Run Ruff (Check and Format)
        run: |
          ruff check .
          ruff format --check .
          
      - name: Run Mypy
        run: mypy --strict app

  unit-tests:
    name: Unit Tests
    needs: lint-and-types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/dev.txt"
          
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
        
      - name: Run Pytest
        run: pytest tests/unit --cov=app --cov-branch --cov-report=xml:coverage.xml --cov-report=html:htmlcov --junitxml=junit.xml
        
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            coverage.xml
            junit.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: warn

  sonarcloud:
    name: SonarCloud Analysis
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate Check
        if: github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/dev.txt"
          
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
        
      - name: Run Smoke Tests (Testcontainers)
        run: pytest tests/integration/test_smoke.py

  api-and-contract:
    name: API & Contract Tests
    needs: [sonarcloud, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Run Newman (Empty for now)
        run: echo "Newman tests will be implemented in TASK-34"

  zap-api-scan:
    name: ZAP API Scan
    needs: [sonarcloud, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/dev.txt"
          
      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Start FastAPI server
        shell: bash
        run: |
          set -euo pipefail
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid

      - name: Wait for FastAPI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json > /tmp/openapi.json; then
              echo "FastAPI is ready"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/uvicorn.pid)" 2>/dev/null; then
              echo "FastAPI exited unexpectedly:"
              cat /tmp/uvicorn.log
              exit 1
            fi
            sleep 1
          done
          echo "FastAPI did not become ready:"
          cat /tmp/uvicorn.log
          exit 1
        
      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          format: openapi
          target: http://127.0.0.1:8000/openapi.json
          rules_file_name: .zap/rules.tsv
          fail_action: true
          artifact_name: zap

  notify-on-failure:
    name: Notify on Failure
    needs: [validate-pr, lint-and-types, unit-tests, sonarcloud, integration-tests, api-and-contract, zap-api-scan]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Send Discord Alert
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: 'The pipeline has failed on branch ${{ github.ref_name }}! Check the logs here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

  build-and-push:
    name: Build & Push Docker Image
    needs: [sonarcloud, integration-tests, api-and-contract, zap-api-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Lowercase Repository Name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Notify Release
        if: always()
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: 'Docker image build and push completed for ${{ github.sha }}. Status: ${{ job.status }}'
