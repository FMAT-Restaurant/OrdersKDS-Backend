name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Global pipeline environment variables and architectural feature flags
env:
  # Feature flag governance (TASK-27 NO-GO / ADR-0011 / V&V §13.5):
  # Optional intermediate dishes (chef batch registration, RF-36..38) are excluded
  # for the 7-sprint horizon (code and tests live or die together).
  # Kept directly in workflow env to avoid committing standalone .env files into Git.
  INTERMEDIATE_DISHES_ENABLED: 'false'
  # Force all JavaScript-based actions to execute using the Node 24 runtime,
  # preventing Node 20 deprecation warnings and future-proofing runner execution.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-pr:
    name: Validate PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH_NAME" == "develop" ]]; then
            echo "Skipping branch name validation for develop branch"
            exit 0
          fi
          if [[ ! "$BRANCH_NAME" =~ ^[a-z0-9]+-[a-z]+$ ]]; then
            echo "Error: Branch name '$BRANCH_NAME' does not match pattern ^[a-z0-9]+-[a-z]+$"
            exit 1
          fi
      - name: Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-types:
    name: Lint, Types & Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/dev.txt"
          
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
        
      - name: Run Gitleaks
        run: |
          curl --proto "=https" --tlsv1.2 -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --source . -v
        
      - name: Run Ruff (Check and Format)
        run: |
          ruff check .
          ruff format --check .
          
      - name: Run Mypy
        run: mypy --strict app

  unit-tests:
    name: Unit Tests
    needs: lint-and-types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/dev.txt"
          
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
        
      - name: Run Pytest
        run: pytest tests/unit --cov=app --cov-branch --cov-report=xml:coverage.xml --cov-report=html:htmlcov --junitxml=junit.xml
        
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: |
            coverage.xml
            junit.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: warn

  sonarcloud:
    name: SonarCloud Analysis
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          
      - name: Download test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-test-results
          
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate Check
        if: github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/dev.txt"
          
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
        
      - name: Run Smoke Tests (Testcontainers)
        run: pytest tests/integration/test_smoke.py

  api-and-contract:
    name: API & Contract Tests
    needs: [sonarcloud, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - name: Run Newman (Empty for now)
        run: echo "Newman tests will be implemented in TASK-34"

  zap-api-scan:
    name: ZAP API Scan
    needs: [sonarcloud, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Least privilege: no `issues: write`. The ZAP report must never be published
    # as a public issue (the repository is public); it stays in the run artifact.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/dev.txt"
          
      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Start FastAPI server
        shell: bash
        run: |
          set -euo pipefail
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid

      - name: Wait for FastAPI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json > /tmp/openapi.json; then
              echo "FastAPI is ready"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/uvicorn.pid)" 2>/dev/null; then
              echo "FastAPI exited unexpectedly:"
              cat /tmp/uvicorn.log
              exit 1
            fi
            sleep 1
          done
          echo "FastAPI did not become ready:"
          cat /tmp/uvicorn.log
          exit 1
        
      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          format: openapi
          target: http://127.0.0.1:8000/openapi.json
          rules_file_name: .zap/rules.tsv
          fail_action: true
          # Security (TASK-39): never open a public issue with scan findings.
          allow_issue_writing: false
          artifact_name: zap

      - name: Send ZAP Report to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_REPORTS }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SCAN_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_REPORTS is not set; skipping notification."
            exit 0
          fi

          REPORT_FILE=""
          if [ -f "report_html.html" ]; then
            REPORT_FILE="report_html.html"
          elif [ -f "report_md.md" ]; then
            REPORT_FILE="report_md.md"
          fi

          STATUS_TEXT="Success"
          if [ "$SCAN_STATUS" != "success" ]; then
            STATUS_TEXT="Warnings or Errors Detected"
          fi

          MESSAGE="**OWASP ZAP API Scan Report ($STATUS_TEXT)**"$'\n'"**Branch:** \`$REF_NAME\` | **Commit:** \`$SHA\`"$'\n'"**Run:** $SERVER_URL/$REPO/actions/runs/$RUN_ID"

          if [ -n "$REPORT_FILE" ]; then
            curl -s -S -X POST \
              -F "content=$MESSAGE" \
              -F "file=@$REPORT_FILE" \
              "$DISCORD_WEBHOOK" > /dev/null || echo "Warning: Failed to deliver Discord notification."
            echo "ZAP report sent to Discord with attachment: $REPORT_FILE"
          else
            curl -s -S -X POST \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"$MESSAGE\n*(No report file found on runner)*\"}" \
              "$DISCORD_WEBHOOK" > /dev/null || echo "Warning: Failed to deliver Discord notification."
            echo "ZAP notification sent to Discord without attachment."
          fi

  notify-on-failure:
    name: Notify on Failure
    needs: [validate-pr, lint-and-types, unit-tests, sonarcloud, integration-tests, api-and-contract, zap-api-scan]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Send Discord Alert
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_ALERTS is not set; skipping notification."
            exit 0
          fi
          MESSAGE="The pipeline has failed on branch ${REF_NAME}! Check the logs here: ${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          curl -s -S -X POST -H "Content-Type: application/json" -d "{\"content\": \"$MESSAGE\"}" "$DISCORD_WEBHOOK" > /dev/null || echo "Warning: Failed to deliver Discord notification."

  build-and-push:
    name: Build & Push Docker Image
    needs: [sonarcloud, integration-tests, api-and-contract, zap-api-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - name: Lowercase Repository Name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.REPO }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            
      - name: Build and Push Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Notify Release
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          SHA: ${{ github.sha }}
          STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_RELEASES is not set; skipping notification."
            exit 0
          fi
          MESSAGE="Docker image build and push completed for ${SHA}. Status: ${STATUS}"
          curl -s -S -X POST -H "Content-Type: application/json" -d "{\"content\": \"$MESSAGE\"}" "$DISCORD_WEBHOOK" > /dev/null || echo "Warning: Failed to deliver Discord notification."

      - name: Notify Release Failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_ALERTS is not set; skipping notification."
            exit 0
          fi
          MESSAGE="Docker image build and push FAILED for ${SHA}! Check the logs here: ${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          curl -s -S -X POST -H "Content-Type: application/json" -d "{\"content\": \"$MESSAGE\"}" "$DISCORD_WEBHOOK" > /dev/null || echo "Warning: Failed to deliver Discord notification."
