<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4b5563" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
    .subtitle { font-size: 13px; fill: #64748b; text-anchor: middle; }
    .participant-box { rx: 8px; stroke-width: 1.5px; filter: url(#shadow); }
    .participant-text { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .lifeline { stroke: #cbd5e1; stroke-width: 1.5px; stroke-dasharray: 4 4; }
    .note-box { rx: 6px; fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1px; }
    .note-text { font-size: 12px; font-weight: 700; fill: #334155; }
    .msg-text { font-size: 11.5px; fill: #1e293b; font-family: 'Consolas', 'Monaco', monospace; }
    .msg-desc { font-size: 10.5px; fill: #64748b; }
    .box-alt { rx: 6px; fill: #fdfefe; stroke: #cbd5e1; stroke-dasharray: 3 3; stroke-width: 1px; }
    .alt-label { font-size: 10.5px; font-weight: 700; fill: #475569; }
  </style>

  <!-- Title -->
  <text x="500" y="32" class="title">Flujo General de Mensajería Inter-Microservicios</text>
  <text x="500" y="52" class="subtitle">Orders &amp; KDS con Menú, Inventario, Pagos y Sala (RabbitMQ Event-Driven)</text>

  <!-- Lifelines -->
  <!-- X positions: Sala=100, Orders=300, Menu=500, Inventario=700, Pagos=900 -->
  <line x1="100" y1="110" x2="100" y2="1140" class="lifeline" />
  <line x1="300" y1="110" x2="300" y2="1140" class="lifeline" />
  <line x1="500" y1="110" x2="500" y2="1140" class="lifeline" />
  <line x1="700" y1="110" x2="700" y2="1140" class="lifeline" />
  <line x1="900" y1="110" x2="900" y2="1140" class="lifeline" />

  <!-- Top Participant Headers -->
  <!-- Sala -->
  <rect x="35" y="70" width="130" height="42" class="participant-box" fill="#fdf2f8" stroke="#ec4899" />
  <text x="100" y="96" class="participant-text" fill="#9d174d">Sala (Floor)</text>

  <!-- Orders & KDS -->
  <rect x="220" y="68" width="160" height="46" class="participant-box" fill="#ecfdf5" stroke="#10b981" stroke-width="2px" />
  <text x="300" y="96" class="participant-text" fill="#047857">Orders &amp; KDS</text>

  <!-- Menú -->
  <rect x="435" y="70" width="130" height="42" class="participant-box" fill="#eff6ff" stroke="#3b82f6" />
  <text x="500" y="96" class="participant-text" fill="#1d4ed8">Menú (Catalog)</text>

  <!-- Inventario -->
  <rect x="635" y="70" width="130" height="42" class="participant-box" fill="#fffbeb" stroke="#f59e0b" />
  <text x="700" y="96" class="participant-text" fill="#b45309">Inventario</text>

  <!-- Pagos -->
  <rect x="835" y="70" width="130" height="42" class="participant-box" fill="#faf5ff" stroke="#a855f7" />
  <text x="900" y="96" class="participant-text" fill="#7e22ce">Pagos</text>

  <!-- ================= SECTION 1: CATALOG SYNC ================= -->
  <rect x="180" y="130" width="640" height="26" class="note-box" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="500" y="147" class="note-text" text-anchor="middle" fill="#1e40af">1. Sincronización del Catálogo de Ofertas (Menu &amp; Dish Catalog)</text>

  <!-- Menu -> Orders: offer created -->
  <line x1="500" y1="180" x2="306" y2="180" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="400" y="174" class="msg-text" text-anchor="middle">menu.oferta.creada / actualizada (offerId, basePrice, status)</text>

  <!-- Menu -> Inv: offer created -->
  <line x1="500" y1="210" x2="694" y2="210" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="600" y="204" class="msg-text" text-anchor="middle">menu.oferta.creada / actualizada (offerId, recetas)</text>

  <!-- Orders self loop: cache to redis -->
  <path d="M 300 230 C 340 230, 340 255, 306 255" fill="none" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow-green)" />
  <text x="350" y="246" class="msg-text">Actualiza copia local en Redis (catalog:platillo:{offerId})</text>

  <!-- ================= SECTION 2: DINING SESSION ================= -->
  <rect x="60" y="280" width="380" height="26" class="note-box" fill="#fdf2f8" stroke="#fbcfe8" />
  <text x="250" y="297" class="note-text" text-anchor="middle" fill="#9d174d">2. Apertura de Mesa y Comanda Inicial (Floor / Sala)</text>

  <!-- Sala -> Orders -->
  <line x1="100" y1="330" x2="294" y2="330" stroke="#db2777" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="200" y="324" class="msg-text" text-anchor="middle">sala.dining_session.iniciada (sessionId, waiterId)</text>

  <!-- Orders self loop: create order -->
  <path d="M 300 350 C 340 350, 340 375, 306 375" fill="none" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow-green)" />
  <text x="350" y="366" class="msg-text">Crea registro de Orden en estado CREATED</text>

  <!-- ================= SECTION 3: SAGA INVENTORY ================= -->
  <rect x="220" y="405" width="560" height="26" class="note-box" fill="#fffbeb" stroke="#fde68a" />
  <text x="500" y="422" class="note-text" text-anchor="middle" fill="#92400e">3. Confirmación de Comanda y Saga de Reserva de Stock (Inventory)</text>

  <!-- Orders -> Inv: order created -->
  <line x1="300" y1="455" x2="694" y2="455" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="500" y="449" class="msg-text" text-anchor="middle">ordenes.orden.creada (orderId, items: [{offerId, quantity}])</text>

  <!-- ALT Box -->
  <rect x="240" y="475" width="520" height="215" class="box-alt" />
  <text x="250" y="492" class="alt-label">alt CASO A: Stock suficiente (Happy Path)</text>

  <!-- Inv -> Orders: stock reserved -->
  <line x1="700" y1="515" x2="306" y2="515" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow-green)" />
  <text x="500" y="509" class="msg-text" text-anchor="middle" fill="#065f46">inventario.stock.reservado (orderId, reservations)</text>

  <path d="M 300 535 C 340 535, 340 555, 306 555" fill="none" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow-green)" />
  <text x="350" y="550" class="msg-text" fill="#065f46">Orden transiciona: CREATED → IN_PREPARATION (KDS activo)</text>

  <!-- ALT separator 1 -->
  <line x1="240" y1="565" x2="760" y2="565" stroke="#cbd5e1" stroke-dasharray="2 2" />
  <text x="250" y="580" class="alt-label">else CASO B: Stock insuficiente</text>

  <!-- Inv -> Orders: stock insufficient -->
  <line x1="700" y1="600" x2="306" y2="600" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow-red)" />
  <text x="500" y="594" class="msg-text" text-anchor="middle" fill="#991b1b">inventario.stock.insuficiente (orderId, missingIngredients)</text>

  <path d="M 300 615 C 340 615, 340 635, 306 635" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow-red)" />
  <text x="350" y="630" class="msg-text" fill="#991b1b">Orden transiciona: CREATED → REJECTED (Alerta al mesero)</text>

  <!-- ALT separator 2 -->
  <line x1="240" y1="645" x2="760" y2="645" stroke="#cbd5e1" stroke-dasharray="2 2" />
  <text x="250" y="660" class="alt-label">else CASO C: Timeout &gt; 60s sin respuesta de Inventario</text>

  <line x1="300" y1="680" x2="694" y2="680" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="4 2" marker-end="url(#arrow-gray)" />
  <text x="500" y="674" class="msg-text" text-anchor="middle" fill="#374151">ordenes.orden.expirada (orderId, elapsedSeconds: 60) → Estado EXPIRED</text>

  <!-- ================= SECTION 4: KITCHEN PREPARATION ================= -->
  <rect x="220" y="720" width="560" height="26" class="note-box" fill="#ecfdf5" stroke="#a7f3d0" />
  <text x="500" y="737" class="note-text" text-anchor="middle" fill="#065f46">4. Preparación en Cocina (KDS) y Consumo Definitivo de Insumos</text>

  <!-- Orders -> Inv: dish prepared -->
  <line x1="300" y1="770" x2="694" y2="770" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow-green)" />
  <text x="500" y="764" class="msg-text" text-anchor="middle">ordenes.platillo.preparado (orderId, itemId, offerId)</text>

  <text x="500" y="784" class="msg-desc" text-anchor="middle">Inventario descuenta definitivamente la reserva de los insumos de esa oferta</text>

  <!-- Orders self loop: all ready -> delivered -->
  <path d="M 300 805 C 340 805, 340 830, 306 830" fill="none" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow-green)" />
  <text x="350" y="822" class="msg-text">Cuando todos los ítems están READY → Orden pasa a DELIVERED</text>

  <!-- ================= SECTION 5: BILLING & PAYMENT ================= -->
  <rect x="220" y="865" width="760" height="26" class="note-box" fill="#faf5ff" stroke="#e9d5ff" />
  <text x="600" y="882" class="note-text" text-anchor="middle" fill="#6b21a8">5. Solicitud de Cuenta, Cobro y Liquidación (Payments)</text>

  <!-- Orders -> Pay: bill/charge requested -->
  <line x1="300" y1="915" x2="894" y2="915" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrow-purple)" />
  <text x="600" y="909" class="msg-text" text-anchor="middle">ordenes.cuenta.solicitada / ordenes.cobro.solicitado (orderId)</text>

  <!-- Pay -> Orders: payment completed -->
  <line x1="900" y1="950" x2="306" y2="950" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrow-purple)" />
  <text x="600" y="944" class="msg-text" text-anchor="middle">pagos.pago.completado (orderId, totalPaid, status: COMPLETED)</text>

  <!-- Orders self loop: paid terminal state -->
  <path d="M 300 970 C 340 970, 340 995, 306 995" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arrow-purple)" />
  <text x="350" y="987" class="msg-text" fill="#6b21a8">Orden transiciona al estado final terminal: PAID</text>

  <!-- Bottom Participant Headers -->
  <rect x="35" y="1030" width="130" height="38" class="participant-box" fill="#fdf2f8" stroke="#ec4899" />
  <text x="100" y="1054" class="participant-text" fill="#9d174d">Sala</text>

  <rect x="220" y="1028" width="160" height="42" class="participant-box" fill="#ecfdf5" stroke="#10b981" stroke-width="2px" />
  <text x="300" y="1054" class="participant-text" fill="#047857">Orders &amp; KDS</text>

  <rect x="435" y="1030" width="130" height="38" class="participant-box" fill="#eff6ff" stroke="#3b82f6" />
  <text x="500" y="1054" class="participant-text" fill="#1d4ed8">Menú</text>

  <rect x="635" y="1030" width="130" height="38" class="participant-box" fill="#fffbeb" stroke="#f59e0b" />
  <text x="700" y="1054" class="participant-text" fill="#b45309">Inventario</text>

  <rect x="835" y="1030" width="130" height="38" class="participant-box" fill="#faf5ff" stroke="#a855f7" />
  <text x="900" y="1054" class="participant-text" fill="#7e22ce">Pagos</text>

</svg>
