<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>

    <!-- Drop shadow -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    .title { font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-size: 13px; fill: #64748b; text-anchor: middle; }
    .state-box { rx: 10px; stroke-width: 2px; filter: url(#card-shadow); }
    .state-title { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .state-desc { font-size: 11px; text-anchor: middle; }
    .transition-label { font-size: 10.5px; font-weight: 600; fill: #334155; }
    .transition-action { font-size: 9.5px; fill: #64748b; font-family: 'Consolas', 'Monaco', monospace; }
    .section-bg { rx: 14px; fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.2px; stroke-dasharray: 4 4; }
    .section-title { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>

  <!-- Title & Subtitle -->
  <text x="550" y="32" class="title">Máquina de Estados de la Comanda (OrderStatus — 10 Estados)</text>
  <text x="550" y="52" class="subtitle">Ciclo de Vida con Estado RESERVED, Consumo en Cocina y Flujo de Reapertura Editable (ADR-0012)</text>

  <!-- Zones Background -->
  <!-- Zona Borrador / Mesa -->
  <rect x="30" y="75" width="280" height="645" class="section-bg" />
  <text x="50" y="98" class="section-title" fill="#2563eb">Fase 1: Captura &amp; Mesero (Tablet)</text>

  <!-- Zona Cocina / KDS -->
  <rect x="330" y="75" width="440" height="645" class="section-bg" />
  <text x="350" y="98" class="section-title" fill="#059669">Fase 2: Cocina &amp; KDS (Monitor Táctil)</text>

  <!-- Zona Cierre / Pagos / Terminal -->
  <rect x="790" y="75" width="280" height="645" class="section-bg" />
  <text x="810" y="98" class="section-title" fill="#7c3aed">Fase 3: Entrega, Cobro &amp; Terminales</text>

  <!-- ================= INITIAL START ================= -->
  <circle cx="80" cy="180" r="14" fill="#0f172a" />
  <circle cx="80" cy="180" r="8" fill="#ffffff" />
  <line x1="94" y1="180" x2="138" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#arr-gray)" />
  <text x="116" y="172" class="transition-action">POST /orders</text>

  <!-- ================= STATE 1: CREATED ================= -->
  <rect x="140" y="145" width="150" height="70" class="state-box" fill="#eff6ff" stroke="#3b82f6" />
  <text x="215" y="174" class="state-title" fill="#1d4ed8">CREATED</text>
  <text x="215" y="193" class="state-desc" fill="#3b82f6">Borrador / Espera Stock</text>
  <text x="215" y="206" class="state-desc" fill="#64748b">awaitingStockConfirmation</text>

  <!-- Confirm Loop / Action -->
  <path d="M 215 145 C 215 115, 275 115, 275 143" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)" />
  <text x="245" y="112" class="transition-label" text-anchor="middle">POST /confirm</text>
  <text x="245" y="125" class="transition-action" text-anchor="middle">fija confirmed_at + ordenes.orden.creada</text>

  <!-- ================= STATE 2: RESERVED ================= -->
  <rect x="370" y="145" width="160" height="70" class="state-box" fill="#f0fdf4" stroke="#10b981" stroke-width="2.2px" />
  <text x="450" y="174" class="state-title" fill="#047857">RESERVED</text>
  <text x="450" y="193" class="state-desc" fill="#059669">Stock Apartado (TTL)</text>
  <text x="450" y="206" class="state-desc" fill="#64748b">Visible en cola activa KDS</text>

  <!-- CREATED -> RESERVED -->
  <line x1="290" y1="180" x2="368" y2="180" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="330" y="165" class="transition-label" text-anchor="middle">Stock OK</text>
  <text x="330" y="176" class="transition-action" text-anchor="middle">inventario.stock.reservado</text>

  <!-- ================= STATE 3: IN_PREPARATION ================= -->
  <rect x="590" y="145" width="160" height="70" class="state-box" fill="#ecfeff" stroke="#06b6d4" />
  <text x="670" y="174" class="state-title" fill="#0e7490">IN_PREPARATION</text>
  <text x="670" y="193" class="state-desc" fill="#0891b2">En Fuego / Cocina</text>
  <text x="670" y="206" class="state-desc" fill="#64748b">Consumo definitivo</text>

  <!-- RESERVED -> IN_PREPARATION -->
  <line x1="530" y1="180" x2="588" y2="180" stroke="#0891b2" stroke-width="2" marker-end="url(#arr-blue)" />
  <text x="560" y="165" class="transition-label" text-anchor="middle">Chef Inicia</text>
  <text x="560" y="176" class="transition-action" text-anchor="middle">PATCH /start-preparation</text>
  <text x="560" y="198" class="transition-action" text-anchor="middle">ordenes.orden.en_preparacion</text>

  <!-- ================= STATE 4: REJECTED (Opción A) ================= -->
  <rect x="140" y="320" width="160" height="74" class="state-box" fill="#fef2f2" stroke="#ef4444" />
  <text x="220" y="347" class="state-title" fill="#b91c1c">REJECTED</text>
  <text x="220" y="365" class="state-desc" fill="#dc2626">Stock Insuficiente / Físico</text>
  <text x="220" y="380" class="state-desc" fill="#64748b">Guarda rejectionDetails</text>

  <!-- CREATED -> REJECTED (Stock Insufficient) -->
  <path d="M 215 215 L 215 318" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)" />
  <text x="205" y="260" class="transition-label" text-anchor="end">Falta Stock</text>
  <text x="205" y="272" class="transition-action" text-anchor="end">inventario.stock.insuficiente</text>

  <!-- RESERVED -> REJECTED (Kitchen Reject) -->
  <path d="M 420 215 C 420 280, 290 280, 270 318" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)" />
  <text x="360" y="265" class="transition-label">Chef Rechaza Ítem</text>
  <text x="360" y="278" class="transition-action">PATCH /items/{id}/kitchen-reject</text>
  <text x="360" y="290" class="transition-action">ordenes.platillo.rechazado_cocina</text>

  <!-- REJECTED -> CREATED (Reopen as Draft) -->
  <path d="M 155 320 C 120 285, 120 245, 153 217" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)" />
  <text x="105" y="265" class="transition-label" text-anchor="end">Mesero Modifica</text>
  <text x="105" y="277" class="transition-action" text-anchor="end">PATCH /orders/{id}/items</text>
  <text x="105" y="289" class="transition-action" text-anchor="end">reopen_as_draft()</text>

  <!-- ================= STATE 5: DELIVERED ================= -->
  <rect x="830" y="145" width="160" height="70" class="state-box" fill="#f0fdf4" stroke="#16a34a" />
  <text x="910" y="174" class="state-title" fill="#15803d">DELIVERED</text>
  <text x="910" y="193" class="state-desc" fill="#16a34a">Charola Lista / Servida</text>
  <text x="910" y="206" class="state-desc" fill="#64748b">Mesero recoge en cocina</text>

  <!-- IN_PREPARATION -> DELIVERED -->
  <line x1="750" y1="180" x2="828" y2="180" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="790" y="165" class="transition-label" text-anchor="middle">Todos READY</text>
  <text x="790" y="176" class="transition-action" text-anchor="middle">PATCH /ready</text>
  <text x="790" y="198" class="transition-action" text-anchor="middle">ordenes.platillo.preparado</text>

  <!-- Redo Loop on DELIVERED -->
  <path d="M 910 145 C 910 115, 970 115, 970 143" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-amber)" />
  <text x="940" y="112" class="transition-label" text-anchor="middle">Rehacer Ítem (OP-12)</text>
  <text x="940" y="125" class="transition-action" text-anchor="middle">PATCH .../redo (Orden sigue DELIVERED)</text>

  <!-- ================= STATE 6: PAID (Terminal) ================= -->
  <rect x="830" y="320" width="160" height="70" class="state-box" fill="#faf5ff" stroke="#9333ea" />
  <text x="910" y="347" class="state-title" fill="#7e22ce">PAID [TERMINAL]</text>
  <text x="910" y="366" class="state-desc" fill="#9333ea">Cuenta Cobrada</text>
  <text x="910" y="380" class="state-desc" fill="#64748b">Fuera de KDS definitivamente</text>

  <!-- DELIVERED -> PAID -->
  <line x1="910" y1="215" x2="910" y2="318" stroke="#9333ea" stroke-width="2" marker-end="url(#arr-purple)" />
  <text x="920" y="260" class="transition-label">Pago Exitoso</text>
  <text x="920" y="272" class="transition-action">pagos.pago.completado</text>

  <!-- ================= TERMINAL & WASTE STATES ================= -->

  <!-- CANCELLED (Terminal) -->
  <rect x="140" y="475" width="160" height="65" class="state-box" fill="#f8fafc" stroke="#64748b" />
  <text x="220" y="502" class="state-title" fill="#334155">CANCELLED [TERMINAL]</text>
  <text x="220" y="520" class="state-desc" fill="#64748b">Cancelación antes de fuego</text>
  <text x="220" y="533" class="state-desc" fill="#94a3b8">Libera reservas en Inventario</text>

  <!-- Cancel from CREATED -->
  <path d="M 160 215 C 70 290, 70 420, 155 473" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)" />
  <text x="95" y="380" class="transition-action" text-anchor="middle">PATCH /cancel</text>

  <!-- Cancel from RESERVED -->
  <path d="M 400 215 C 380 340, 270 420, 235 473" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)" />
  <text x="320" y="440" class="transition-label" text-anchor="middle">Cancela en RESERVED</text>
  <text x="320" y="452" class="transition-action" text-anchor="middle">ordenes.orden.cancelada</text>

  <!-- Cancel from REJECTED -->
  <line x1="220" y1="394" x2="220" y2="473" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)" />
  <text x="230" y="435" class="transition-action">Descarta orden</text>

  <!-- EXPIRED (Terminal) -->
  <rect x="140" y="615" width="160" height="65" class="state-box" fill="#fff7ed" stroke="#ea580c" />
  <text x="220" y="642" class="state-title" fill="#c2410c">EXPIRED [TERMINAL]</text>
  <text x="220" y="660" class="state-desc" fill="#ea580c">Timeout Saga &gt;= 60 s</text>
  <text x="220" y="673" class="state-desc" fill="#64748b">ordenes.orden.expirada (OP-04)</text>

  <path d="M 180 215 C 40 330, 40 550, 160 613" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arr-amber)" />
  <text x="50" y="550" class="transition-label">Sin respuesta &gt;= 60s</text>
  <text x="50" y="562" class="transition-action">SagaTimeoutWatcher</text>

  <!-- WASTED (Mermada con cobro) -->
  <rect x="530" y="320" width="150" height="70" class="state-box" fill="#fffbeb" stroke="#d97706" />
  <text x="605" y="347" class="state-title" fill="#b45309">WASTED</text>
  <text x="605" y="365" class="state-desc" fill="#d97706">Mermada (Con Cobro)</text>
  <text x="605" y="378" class="state-desc" fill="#64748b">Anulación Admin</text>

  <!-- IN_PREP -> WASTED -->
  <line x1="640" y1="215" x2="620" y2="318" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-amber)" />
  <text x="645" y="260" class="transition-label">PATCH /void</text>
  <text x="645" y="272" class="transition-action">ordenes.comanda.mermada</text>
  <text x="645" y="284" class="transition-action">+ cobro.solicitado</text>

  <!-- WASTED -> PAID -->
  <line x1="680" y1="355" x2="828" y2="355" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arr-purple)" />
  <text x="750" y="347" class="transition-action" text-anchor="middle">Pago de Merma</text>

  <!-- VOIDED (Anulada sin cobro) -->
  <rect x="630" y="475" width="150" height="65" class="state-box" fill="#fdf2f8" stroke="#ec4899" />
  <text x="705" y="502" class="state-title" fill="#be185d">VOIDED [TERMINAL]</text>
  <text x="705" y="520" class="state-desc" fill="#db2777">Error Cocina (Sin Cobro)</text>
  <text x="705" y="533" class="state-desc" fill="#64748b">Merma asumida por cocina</text>

  <!-- IN_PREP -> VOIDED -->
  <path d="M 700 215 C 720 280, 720 400, 710 473" fill="none" stroke="#db2777" stroke-width="1.8" marker-end="url(#arr-red)" />
  <text x="725" y="265" class="transition-label">PATCH /void-kitchen-error</text>
  <text x="725" y="277" class="transition-action">ordenes.comanda.mermada</text>
  <text x="725" y="289" class="transition-action">motivo: error_cocina</text>

  <!-- Legend Bottom -->
  <rect x="360" y="665" width="400" height="35" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
  <circle cx="380" cy="682" r="5" fill="#3b82f6" />
  <text x="390" y="686" class="transition-action">Borrador</text>
  <circle cx="450" cy="682" r="5" fill="#10b981" />
  <text x="460" y="686" class="transition-action">Stock Apartado (KDS)</text>
  <circle cx="580" cy="682" r="5" fill="#ef4444" />
  <text x="590" y="686" class="transition-action">Rechazado (Editable)</text>
  <circle cx="700" cy="682" r="5" fill="#64748b" />
  <text x="710" y="686" class="transition-action">Terminal</text>
</svg>
