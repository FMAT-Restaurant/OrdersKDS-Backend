# Alembic configuration for Orders & KDS Backend
#
# The DATABASE_URL is read from the environment (never hardcoded here).
# app/alembic/env.py reads os.environ["DATABASE_URL"] at runtime, which is
# why sqlalchemy.url is set to a placeholder — env.py overrides it before
# any migration command runs.
#
# To apply migrations locally:
#   1. python scripts/setup_env.py        (creates .env with local defaults)
#   2. docker compose up -d postgres
#   3. alembic upgrade head               (env.py loads .env automatically;
#                                          real environment variables win)
#
# Create a migration:  alembic revision --autogenerate -m "describe change"
#
# In CI the variable is injected from GitHub Secrets.
[alembic]
script_location = app/alembic

# Put the project root on sys.path so env.py can import `app.*`.
prepend_sys_path = .

# Sortable, human-readable file names: 20261003_0830_<rev>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Overridden at runtime by env.py — do NOT put real credentials here.
sqlalchemy.url = postgresql+asyncpg://localhost/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
