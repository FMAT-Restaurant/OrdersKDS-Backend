# Alembic configuration for Orders & KDS Backend
#
# The DATABASE_URL is read from the environment (never hardcoded here).
# app/alembic/env.py reads os.environ["DATABASE_URL"] at runtime, which is
# why sqlalchemy.url is set to a placeholder — env.py overrides it before
# any migration command runs.
#
# To apply migrations locally:
#   1. Make sure .env is populated (python scripts/setup_env.py).
#   2. Export the variable: export $(grep -v '^#' .env | xargs)
#      (or activate the venv where python-dotenv loads .env automatically).
#   3. alembic upgrade head
#
# In CI the variable is injected from GitHub Secrets.
[alembic]
script_location = app/alembic

# Overridden at runtime by env.py — do NOT put real credentials here.
sqlalchemy.url = postgresql+asyncpg://localhost/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
